<style>
  :root {
    --paper: #FFF1E5;
    --ink: #241f1a;
    --ink-soft: #4d443c;
    --blue: #0019FF;
    --orange: #FF9000;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Jost", "Futura", "Gill Sans", "Century Gothic", sans-serif;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.25rem;
    gap: 1.6rem;
  }
  .logo {
    width: min(320px, 74vw);
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .logoline {
    padding: 1rem 1.25rem 0;
  }
  .oneliner {
    font-size: 1.55rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
    max-width: 30rem;
    line-height: 1.45;
  }
  #widget {
    margin-top: 1.9rem;
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--ink);
    max-width: 92vw;
    line-height: 1.9;
    cursor: default;
    user-select: none;
  }
  #glyph { color: var(--blue); display: inline-block; width: 1.1em; text-align: center; }
  #glyph.g-orange { color: var(--orange); }
  #term { transition: opacity 0.25s ease; }
  #term.fading { opacity: 0; }
  #term.rare { color: var(--orange); }
  #meta { color: var(--ink-soft); opacity: 0.75; white-space: nowrap; display: inline-block; }
  #widget.interrupted #glyph,
  #widget.interrupted #term { color: var(--orange); }
  .li {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 2.4rem;
    color: var(--blue);
    text-decoration: none;
    font-weight: 500;
    font-size: 1.1rem;
    letter-spacing: 0.01em;
  }
  .li svg { width: 30px; height: 30px; flex-shrink: 0; }
  .li:hover { color: var(--orange); }
  .caret {
    display: inline-block;
    width: 0.55em;
    height: 1.05em;
    background: var(--ink-soft);
    opacity: 0.6;
    vertical-align: text-bottom;
    margin-left: 0.35em;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  footer {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    text-align: center;
    padding: 1.5rem 1rem 2rem;
  }
  footer a { color: var(--ink-soft); text-decoration: none; }
  footer a:hover { color: var(--orange); }
  footer .sep { margin: 0 0.55em; opacity: 0.5; }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
    #term { transition: none; }
  }
  @media (max-width: 480px) {
    #widget { font-size: 0.78rem; }
    .oneliner { font-size: 1.08rem; }
  }
</style>
</head>
<body>

Contact: email@snowball-consult.com. More about the practice on the About page.</p>

    <span>Andreas Wernicke</span>

  <img class="logo" src="assets/snowball-logo.png" alt="Snowball Consult">

  <a href="mailto:email@snowball-consult.com">email@snowball-consult.com</a>

<script>
(function () {
  "use strict";
  // Terms prefixed with * are the rare tier and render in orange.
  var TERMS = [
    // Real GTM/RevOps operations
    "Deduplicating the CRM", "Normalizing state codes", "Backfilling lifecycle stages",
    "Scoring accounts", "Routing leads", "Merging duplicate companies",
    "Auditing the UTM taxonomy", "Rebuilding the funnel report", "Enriching 1,204 rows",
    "Mapping fields", "Cleansing the pipeline", "Reconciling closed-lost reasons",
    "Standardizing job titles", "Parsing referral chains", "Segmenting the TAM",
    "Refreshing firmographics", "Validating email syntax", "Warming the domain",
    "Throttling the sequencer", "Tagging champions", "Re-scoring the ICP",
    "Drafting the enrichment spec", "Versioning the schema", "Documenting the workflow",
    "Pruning stale workflows", "Archiving zombie sequences", "Syncing HubSpot properties",
    "Untangling lifecycle logic", "Rescuing orphaned contacts", "Attributing the pipeline",
    "Deduplicating the dedupe rules", "Normalizing country names", "Flattening the org chart",
    "Resolving domain collisions", "Chasing bounced emails", "Suppressing unsubscribes",
    "Grooming the lead queue", "Calibrating the scoring model", "Weighting intent signals",
    "Sampling the enrichment output", "Spot-checking 50 rows", "Diffing the property audit",
    "Renaming fields responsibly", "Retiring legacy fields", "Testing the webhook",
    "Replaying failed syncs", "Batching the backfill", "Verifying at the data layer",
    "Reading the API docs", "Re-reading the API docs", "Paginating the export",
    "Rate-limiting politely", "Caching the lookups", "Hashing the join keys",
    "Joining on Record ID", "Refusing to join on domain", "Snapshotting before the bulk op",
    "Rolling back gracefully", "Escaping the CSV commas", "Fixing the timezone bug",
    "Trimming trailing whitespace", "Upper-casing the ISO codes", "Geocoding headquarters",
    "Inferring company size", "Flagging PO boxes", "Detecting free-mail domains",
    "Waterfalling the providers", "Benchmarking match rates", "Negotiating with the API",
    "Retrying with backoff", "Logging everything", "Monitoring the drain",
    "Counting the rows twice", "Enrolling one record first", "Simulating before shipping",
    "Shipping the simple version", "Measuring before optimizing", "Instrumenting the handoffs",
    "Closing the loop", "Wiring the notifications",
    // Consulting satire
    "Synergizing", "Ideating", "Workshopping", "Whiteboarding", "Circling back",
    "Double-clicking", "Aligning stakeholders", "Boiling the ocean", "Moving the needle",
    "Leveraging learnings", "Socializing the deck", "Shifting the paradigm",
    "Unlocking value", "Operationalizing insights", "Evangelizing best practices",
    "Cascading the OKRs", "Sunsetting the initiative", "Right-sizing expectations",
    "Future-proofing the roadmap", "De-risking the rollout", "Pressure-testing assumptions",
    "Stress-testing the narrative", "Gut-checking the numbers", "Level-setting",
    "Touching base", "Taking this offline", "Parking that for now", "Putting a pin in it",
    "Reading the room", "Herding the calendar invites", "Finding a time that works",
    "Following up on the follow-up", "Pinging gently", "Nudging politely",
    "Bubbling this up", "Looping in legal", "Getting buy-in", "Building consensus",
    "Managing up", "Drilling down", "Zooming out", "Peeling the onion",
    "Slicing the data differently", "Adding a swim lane", "Color-coding the risks",
    "Bolding the takeaways", "Shortening the deck", "Lengthening the appendix",
    "Renaming the final_v2 file", "Finalizing final_final_v3", "Scheduling the pre-meeting",
    "Debriefing the debrief", "Templatizing the template", "Frameworking",
    "Best-practicing", "Thought-leadering", "North-starring", "Flywheeling",
    "Value-adding", "Quick-winning",
    // Claude-Code-style absurdities, consulting accent
    "Percolating pipeline", "Herding attribution models", "Defenestrating spreadsheets",
    "*Snowballing", "Ruminating on RevOps", "Marinating the segments",
    "Fermenting the funnel", "Massaging the data", "Whispering to the CRM",
    "Negotiating with a dropdown", "Untangling the spaghetti sync", "Polishing the pivot table",
    "Alphabetizing the acronyms", "Decaffeinating the dashboard", "Rehearsing the demo",
    "Blowing on the dice", "Consulting the consultants", "Auditing the audit",
    "Meta-analyzing", "Overthinking the naming", "Underthinking the naming",
    "Recalculating enthusiasm", "Buffering professionally", "Compiling talking points",
    "Warming up the jargon", "Stretching before the sprint", "Feeding the flywheel",
    "Watering the evergreen content", "Dusting the knowledge base", "Vacuuming the data lake",
    "Draining the data swamp", "Petting the unicorn metrics", "Chasing a missing semicolon",
    "Blaming the cache", "Clearing the cache anyway", "Turning it off and on again",
    "*Reticulating splines", "Summoning product-market fit", "Manifesting pipeline",
    "Squinting at the chart",
    // On-brand riffs
    "*Raising the floor", "*Picking the right problem", "*Holstering silver bullets",
    "Asking the right questions", "Asking better questions", "Facilitating shared understanding",
    "Planning the solution", "Executing the plan", "Learning along the way",
    "Educating along the way", "Skipping the latest and greatest", "Choosing boring tools",
    "Building it with you", "Showing the cards", "Keeping the client count small",
    "Solving better problems", "Discovering new challenges", "Making better data",
    "Weaving data into workflows", "*Shipping GTM data systems"
  ];

  var GLYPHS = ["✳", "✴", "✽", "✴"];

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var glyphEl = document.getElementById("glyph");
  var termEl = document.getElementById("term");
  var metaEl = document.getElementById("meta");
  var widget = document.getElementById("widget");

  var deck = [], deckPos = 0, lastTerm = "";
  function reshuffle() {
    deck = TERMS.slice();
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    if (deck[0] === lastTerm) { deck.push(deck.shift()); }
    deckPos = 0;
  }
  function nextTerm() {
    if (deckPos >= deck.length) reshuffle();
    var t = deck[deckPos++];
    lastTerm = t;
    return t;
  }

  var interrupted = false;

  // Elapsed since Jan 01 2023, shown as "3y 7m".
  var start = new Date(2023, 0, 1);
  var now = new Date();
  var months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  if (now.getDate() < start.getDate()) months--;
  var tenure = Math.floor(months / 12) + "y " + (months % 12) + "m";

  function renderMeta() {
    metaEl.textContent = " (esc to interrupt · " + tenure + ")";
  }

  function showTerm(raw) {
    var rare = raw.charAt(0) === "*";
    var text = rare ? raw.slice(1) : raw;
    termEl.textContent = text + "…";
    termEl.classList.toggle("rare", rare);
    renderMeta();
  }

  // Single managed timer: interrupts and cycles never stack chains.
  var cycleTimer = null;
  function scheduleCycle() {
    clearTimeout(cycleTimer);
    cycleTimer = setTimeout(cycle, reduced ? 6000 : 2500 + Math.random() * 1500);
  }

  function cycle() {
    if (interrupted) return;
    var t = nextTerm();
    if (reduced) {
      showTerm(t);
    } else {
      termEl.classList.add("fading");
      setTimeout(function () {
        termEl.classList.remove("fading");
        if (interrupted) return;
        showTerm(t);
      }, 250);
    }
    scheduleCycle();
  }

  function interrupt() {
    if (interrupted) return;
    interrupted = true;
    clearTimeout(cycleTimer);
    widget.classList.add("interrupted");
    glyphEl.textContent = "✗";
    termEl.classList.remove("rare");
    termEl.classList.remove("fading");
    termEl.textContent = "Interrupted · picking a better problem…";
    metaEl.textContent = " (resuming)";
    setTimeout(function () {
      widget.classList.remove("interrupted");
      glyphEl.textContent = "✳";
      interrupted = false;
      showTerm(nextTerm());
      scheduleCycle();
    }, 2200);
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") interrupt();
  });
  // A click that merely clears a text selection elsewhere on the page
  // should not fire the interrupt.
  var hadSelection = false;
  document.addEventListener("mousedown", function () {
    var s = window.getSelection();
    hadSelection = !!s && !s.isCollapsed;
  });
  widget.addEventListener("click", function () {
    if (hadSelection) return;
    interrupt();
  });

  reshuffle();
  showTerm(nextTerm());
  scheduleCycle();

  if (!reduced) {
    var gi = 0;
    setInterval(function () {
      if (interrupted) return;
      gi = (gi + 1) % GLYPHS.length;
      glyphEl.textContent = GLYPHS[gi];
      glyphEl.classList.toggle("g-orange", Math.random() < 0.04);
    }, 160);
  }
})();
</script>

</body>
</html>
